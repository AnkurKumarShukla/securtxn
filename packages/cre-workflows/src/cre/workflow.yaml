# ==========================================================================
# CRE WORKFLOW SETTINGS FILE
# ==========================================================================
# Paths verified against a real `cre init --template=hello-confidential-
# workflows-ts` scaffold, adapted from its flat layout to ours (this file
# lives at packages/cre-workflows/src/cre/, two levels below the package
# root where project.yaml and secrets.yaml sit).
staging-settings:
  user-workflow:
    workflow-name: "vendor-match-staging"
    # Chainlink-hosted, off-chain: no gas and no wallet key, which is what a
    # demo deployment wants. `cre registry list` shows the alternative,
    # "onchain:ethereum-mainnet", which needs both.
    deployment-registry: "private"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.staging.json"
    secrets-path: "../../secrets.yaml"

# ==========================================================================
production-settings:
  user-workflow:
    workflow-name: "vendor-match-production"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.production.json"
    secrets-path: "../../secrets.yaml"
